services:
  - type: web
    name: homevalue
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m ml.train_model
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 wsgi:app
    healthCheckPath: /api/session
    envVars:
      - key: HOMEVALUE_SECRET_KEY
        generateValue: true
      - key: HOMEVALUE_ADMIN_USER
        value: admin@homevalue.local
      - key: HOMEVALUE_ADMIN_PASSWORD
        generateValue: true
